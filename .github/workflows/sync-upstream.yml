name: Sync upstream (m-x-d/Heretic2R)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use PAT so downstream workflows fire on the resulting push.
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config rerere.enabled true
          git config rerere.autoupdate true
          git config checkout.defaultRemote origin
          # Upstream commits CRLF, the unix branch is LF. Without renormalization every
          # file both sides touched conflicts in FULL (whole-file conflict) even when the
          # content is identical. Two safeguards, because .gitattributes only lives on the
          # unix branch and is absent while main is checked out:
          #   1. .git/info/attributes applies regardless of which branch is checked out.
          #   2. core.autocrlf=input makes text=auto the default even without attributes.
          git config merge.renormalize true
          git config core.autocrlf input
          printf '* text=auto eol=lf\n' > .git/info/attributes

      # Fail fast if the CRLF safeguards above aren't actually in effect: without them
      # the merge still "works", but reports a huge bogus conflict set (every co-touched
      # file, whole-file) that masks the handful of real content conflicts.
      - name: Verify CRLF normalization is active
        run: |
          attr=$(git check-attr text -- probe.c | sed 's/.*: //')
          renorm=$(git config --get merge.renormalize || echo false)
          echo "text attribute = $attr / merge.renormalize = $renorm"
          if [ "$attr" != "auto" ] || [ "$renorm" != "true" ]; then
            echo "::error::CRLF normalization inactive - merge would produce bogus whole-file conflicts."
            exit 1
          fi

      # Persist rerere resolutions across runs so recurring conflict patterns
      # (same upstream change vs same unix patch) auto-resolve without manual intervention.
      - name: Restore rerere cache
        uses: actions/cache/restore@v4
        with:
          path: .git/rr-cache
          key: rerere-${{ github.run_id }}
          restore-keys: rerere-

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/m-x-d/Heretic2R.git
          git fetch upstream --tags
          git fetch origin unix

      - name: Check for new upstream commits
        id: check
        run: |
          LOCAL=$(git rev-parse origin/main)
          UPSTREAM=$(git rev-parse upstream/main)
          UNIX_BASE=$(git merge-base origin/unix "$UPSTREAM")
          # Skip only if main is at upstream AND unix already contains it.
          if [ "$LOCAL" = "$UPSTREAM" ] && [ "$UNIX_BASE" = "$UPSTREAM" ]; then
            echo "main and unix both up to date with upstream."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [ "$LOCAL" != "$UPSTREAM" ]; then
              echo "Found $(git rev-list --count "$LOCAL..$UPSTREAM") new upstream commit(s)."
            fi
            if [ "$UNIX_BASE" != "$UPSTREAM" ]; then
              echo "unix needs to merge $(git rev-list --count "$UNIX_BASE..$UPSTREAM") commit(s)."
            fi
            {
              echo 'log<<EOF'
              git log --oneline "$UNIX_BASE..$UPSTREAM"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Fast-forward main to upstream
        if: steps.check.outputs.skip == 'false'
        run: |
          # Idempotent: if main is already at upstream, --ff-only is a no-op
          # and the push is "Everything up-to-date".
          git checkout main
          git merge --ff-only upstream/main
          # Strip any upstream workflow changes — GITHUB_TOKEN can't push them,
          # and the unix branch manages its own workflows anyway.
          git checkout origin/main -- .github/workflows/ 2>/dev/null || true
          if ! git diff --quiet origin/main HEAD; then
            git push origin HEAD:refs/heads/main
          fi

      - name: Merge main into unix
        if: steps.check.outputs.skip == 'false'
        id: rebase
        run: |
          git switch unix
          if git merge --no-edit refs/heads/main; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            hash() { git show "$1" 2>/dev/null | git hash-object --stdin; }
            hash_nocr() { git show "$1" 2>/dev/null | tr -d '\r' | git hash-object --stdin; }
            crlf_only=0
            : > /tmp/conflicts.txt
            git diff --name-only --diff-filter=U > /tmp/unmerged.txt || true
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              base_raw=$(hash ":1:$f")       || base_raw=no-base
              theirs_raw=$(hash ":3:$f")     || theirs_raw=no-theirs
              base_str=$(hash_nocr ":1:$f")  || base_str=no-base
              ours_str=$(hash_nocr ":2:$f")  || ours_str=no-ours
              theirs_str=$(hash_nocr ":3:$f")|| theirs_str=no-theirs
              if [ "$ours_str" = "$theirs_str" ] || \
                 { [ "$base_str" = "$theirs_str" ] && [ "$base_raw" != "$theirs_raw" ]; }; then
                echo "[line-endings] $f" >> /tmp/conflicts.txt
                crlf_only=$((crlf_only + 1))
              else
                echo "[content]      $f" >> /tmp/conflicts.txt
              fi
            done < /tmp/unmerged.txt
            git merge --abort
            {
              echo 'conflicts<<EOF'
              cat /tmp/conflicts.txt
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            echo "crlf_only=$crlf_only" >> "$GITHUB_OUTPUT"
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged unix
        if: steps.check.outputs.skip == 'false' && steps.rebase.outputs.success == 'true'
        run: git push origin HEAD:refs/heads/unix

      # Mirror upstream release tags: R5 → R5-unix (points to unix HEAD at
      # time of integration, i.e. the unix port that includes all R5 changes).
      - name: Mirror upstream release tags
        if: steps.check.outputs.skip == 'false' && steps.rebase.outputs.success == 'true'
        run: |
          UNIX_HEAD=$(git rev-parse unix)
          git tag -l | while read -r tag; do
            case "$tag" in *-unix) continue ;; esac   # skip already-mirrored tags
            unix_tag="${tag}-unix"
            # Only mirror tags that are now ancestors of main (i.e. incorporated).
            if git merge-base --is-ancestor "$tag" main 2>/dev/null && \
               ! git rev-parse "refs/tags/$unix_tag" >/dev/null 2>&1; then
              git tag "$unix_tag" "$UNIX_HEAD"
              git push origin "$unix_tag"
              echo "Created tag $unix_tag at $UNIX_HEAD"
            fi
          done

      # Always save rerere cache so resolutions accumulate across runs.
      - name: Save rerere cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .git/rr-cache
          key: rerere-${{ github.run_id }}

      # On conflict: open (or find existing open) issue rather than silently failing.
      - name: Open issue on merge conflict
        if: steps.check.outputs.skip == 'false' && steps.rebase.outputs.success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const log       = `${{ steps.check.outputs.log }}`;
            const conflicts = `${{ steps.rebase.outputs.conflicts }}`;
            const crlfOnly  = parseInt(`${{ steps.rebase.outputs.crlf_only }}` || '0', 10);
            const assignee  = context.repo.owner;

            // Any [line-endings] conflict means normalization slipped: the reported set is
            // inflated with files whose content is actually identical.
            const crlfWarning = crlfOnly > 0
              ? [
                  '> [!WARNING]',
                  `> ${crlfOnly} conflict(s) are **line endings only** (identical content once CR is stripped).`,
                  '> CRLF renormalization did not take effect, so this list is inflated and hides the real conflicts.',
                  '',
                ].join('\n')
              : '';

            // Reproduces CI's conflict set exactly; without the flags every co-touched
            // file conflicts in full.
            const resolveSteps = [
              '```sh',
              'git fetch origin main',
              'git checkout unix',
              '# Upstream is CRLF, unix is LF - these flags are required, or every file',
              '# both sides touched conflicts in full (whole-file) instead of just the real ones.',
              'git -c core.autocrlf=input -c merge.renormalize=true merge origin/main',
              '# resolve conflicts, git add <files>, then:',
              'git commit',
              'git push origin unix',
              '```',
            ].join('\n');

            // Avoid duplicate issues — check for an existing open sync-conflict issue.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'upstream-sync-conflict',
            });

            if (existing.data.length > 0) {
              const number = existing.data[0].number;
              await github.rest.issues.createComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                issue_number: number,
                body: `**New sync failure** (run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}))\n\n${crlfWarning}**New upstream commits**\n\`\`\`\n${log}\n\`\`\`\n\n**Conflicted files**\n\`\`\`\n${conflicts}\n\`\`\``,
              });
              // Re-assert assignment in case the issue was left unassigned.
              await github.rest.issues.addAssignees({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                issue_number: number,
                assignees:  [assignee],
              });
            } else {
              await github.rest.issues.create({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                title:  '⚠️ Upstream sync — merge conflict requires manual resolution',
                labels: ['upstream-sync-conflict'],
                assignees: [assignee],
                body: [
                  '## Upstream sync failed',
                  '',
                  'The automated merge of upstream `main` into `unix` hit a conflict.',
                  'This issue will receive a comment on each subsequent failure until resolved.',
                  '',
                  crlfWarning,
                  '### New upstream commits',
                  '```',
                  log,
                  '```',
                  '',
                  '### Conflicted files',
                  '```',
                  conflicts,
                  '```',
                  '',
                  '### To resolve locally',
                  resolveSteps,
                  '',
                  '_Close this issue once the conflict is resolved and pushed._',
                ].join('\n'),
              });
            }
