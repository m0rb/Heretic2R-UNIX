name: Build (macOS)

on:
  workflow_call:
  workflow_dispatch:


jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make gcc sdl3 pkg-config vulkan-headers

      - name: Build
        run: |
          # Homebrew headers are not on the default include path (esp. Apple Silicon).
          export VULKAN_CFLAGS="-I$(brew --prefix)/include"
          make -j$(sysctl -n hw.logicalcpu)
          make server -j$(sysctl -n hw.logicalcpu)
          # Fail loudly if a renderer module silently did not build. ref_vk is
          # required here because this platform ships Vulkan headers; platforms
          # without them skip it by design.
          for m in gl1 gl3 vk; do
            test -f "build/release/ref_$m.dylib" || { echo "::error::ref_$m.dylib was not built"; exit 1; }
          done

      - name: Stage release artifacts
        run: |
          mkdir -p dist dist-ded
          cp build/release/heretic2r dist/
          # Renderer modules must sit next to the executable (the engine scans its own dir).
          cp build/release/ref_*.dylib dist/
          cp -r build/release/base dist/
          cp build/release/heretic2r-server dist-ded/
          cp -r build/release/base dist-ded/

      - name: Create archives
        run: |
          ARCH=$(uname -m)
          tar czf heretic2r-macos-${ARCH}.tar.gz -C dist .
          tar czf heretic2r-server-macos-${ARCH}.tar.gz -C dist-ded .

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: heretic2r-macos
          path: heretic2r-macos-*.tar.gz

      - name: Upload dedicated server artifact
        uses: actions/upload-artifact@v4
        with:
          name: heretic2r-server-macos
          path: heretic2r-server-macos-*.tar.gz
