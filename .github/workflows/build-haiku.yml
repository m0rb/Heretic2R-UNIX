name: Build (Haiku)

on:
  workflow_call:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build on Haiku
        uses: vmactions/haiku-vm@v1
        with:
          usesh: true
          prepare: |
            pkgman install -y cmake ninja pkgconfig libexecinfo_devel

          run: |
            # Build SDL3 from source — not yet in HaikuPorts.
            git clone --depth 1 --branch release-3.2.10 https://github.com/libsdl-org/SDL.git SDL3-src
            cmake -S SDL3-src -B SDL3-build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/boot/system/non-packaged \
              -DSDL_SHARED=ON \
              -DSDL_STATIC=OFF \
              -DSDL_TEST=OFF
            cmake --build SDL3-build --parallel
            cmake --install SDL3-build

            export PKG_CONFIG_PATH=/boot/system/non-packaged/lib/pkgconfig

            NCPU=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)
            make -j$NCPU
            make server -j$NCPU
            # Fail loudly if a renderer module silently did not build. ref_vk is
            # required here because this platform ships Vulkan headers; platforms
            # without them skip it by design.
            for m in gl1 gl3; do
              test -f "build/release/ref_$m.so" || { echo "::error::ref_$m.so was not built"; exit 1; }
            done

            mkdir -p dist dist-ded
            cp build/release/heretic2r dist/
            # Renderer modules must sit next to the executable (the engine scans its own dir).
            cp build/release/ref_*.so dist/
            cp -r build/release/base dist/
            # Bundle SDL3 shared library alongside the binary ($ORIGIN rpath resolves it).
            # Include the SDL3 license as required by its zlib license terms.
            cp /boot/system/non-packaged/lib/libSDL3.so.0 dist/
            cp SDL3-src/LICENSE.txt dist/LICENSE.SDL3.txt
            cp build/release/heretic2r-server dist-ded/
            cp -r build/release/base dist-ded/
            tar czf heretic2r-haiku-$(uname -m).tar.gz -C dist .
            tar czf heretic2r-server-haiku-$(uname -m).tar.gz -C dist-ded .

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: heretic2r-haiku
          path: heretic2r-haiku-*.tar.gz

      - name: Upload dedicated server artifact
        uses: actions/upload-artifact@v4
        with:
          name: heretic2r-server-haiku
          path: heretic2r-server-haiku-*.tar.gz
